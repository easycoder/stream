<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filming — Admin</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f5">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Filming">
</head>
<body>
    <pre id="allspeak-script" style="display:none">
    variable Script
    rest get Script from `admin-main.allspeak`
    run Script
    </pre>
    <script>
    (function() {
        var t = Date.now();
        var s = document.createElement('script');
        s.src = 'allspeak.js?v=' + t;
        s.onload = function() { AllSpeak_Startup(); };
        document.head.appendChild(s);
    })();
    </script>
    <script>
    // PWA shell: registered after the page has loaded so the worker never
    // competes with the runtime for the initial fetches. The worker caches
    // only the shell and leaves every data request to the network.
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('sw.js', { scope: './' }).catch(function(err) {
                console.warn('Service worker registration failed:', err);
            });
        });
    }
    </script>
</body>
</html>
